name: shopping_list
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8
  meta: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: 0.14.3
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 300
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Regular.ttf
          weight: 500
        - asset: fonts/Inter-Regular.ttf
          weight: 600
        - asset: fonts/Inter-SemiBold.ttf
          weight: 700
        - asset: fonts/Inter-SemiBold.ttf
          weight: 800
        - asset: fonts/Inter-SemiBold.ttf
          weight: 900
